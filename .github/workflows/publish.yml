name: publish-9router

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm --prefix tests ci
      - name: Run focused tests
        run: npx vitest run unit/probe-admin-auth.test.js unit/probe-models-route.test.js unit/probe-profiles-crypto.test.js unit/v1-models-acl.test.js
        working-directory: tests
      - run: npm run build

  build:
    needs: verify
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
            digest_key: amd64_digest
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            digest_key: arm64_digest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          provenance: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Collect digest
        run: |
          printf '{"%s":"%s"}\n' '${{ matrix.digest_key }}' '${{ steps.build.outputs.digest }}' > 'digest-${{ matrix.digest_key }}.json'
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.digest_key }}
          path: digest-${{ matrix.digest_key }}.json

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - name: Read digests
        id: digests
        run: |
          echo "amd64=$(jq -r '.amd64_digest' digests/digest-amd64_digest.json)" >> "$GITHUB_OUTPUT"
          echo "arm64=$(jq -r '.arm64_digest' digests/digest-arm64_digest.json)" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Merge manifests and publish latest
        run: |
          docker buildx imagetools create -t "${IMAGE}:latest" \
            "${IMAGE}@${{ steps.digests.outputs.amd64 }}" \
            "${IMAGE}@${{ steps.digests.outputs.arm64 }}"
